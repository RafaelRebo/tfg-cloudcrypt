version: '3.8'

services:
  cloudcrypt-db:
    image: mysql:8.0
    container_name: cloudcrypt-database
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cloudcrypt_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  cloudcrypt-app:
    build: .
    container_name: cloudcrypt-server
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./config:/app/config
    depends_on:
      - cloudcrypt-db
    restart: unless-stopped

volumes:
  mysql_data: